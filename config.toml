version = 1

[output]
timezone = "Asia/Tokyo"
format = "markdown"
save_to = "./reports"
include_summary = true

[telegram]
enabled = true
bot_token = "8613115746:AAFqi8RrP6eGNKPdOmazv_kAI70CnSTnCV0"
chat_id = "8442596122"


[rules.trend]
lookback_days = 20
flat_threshold_pct = 0.5 # [-0.5%, +0.5%] 视为走平

[rules.deviation_bands]
# 阶梯下限阈值 (>=命中)
overheat_2 = 30.0   
overheat_1 = 15.0   
cruise     = 5.0    
optimal    = -5.0   
pullback   = -15.0  
fear_1     = -25.0  

[rules.actions]
# 默认的全局文案现在针对的是“个股”（非定投类）
overheat_2 = "停止买入，注意回调风险"
overheat_1 = "减半买入，寻找左侧机会"
cruise     = "按计划加仓个股"
optimal    = "绝佳位置，积极加仓个股"
pullback   = "适度加仓（逢低买入）"
fear_1     = "过度恐慌：用极少现金抢左侧"
fear_2     = "过度恐慌：考虑极端反弹机会"

[rules.bear_mode]
enabled = true
fallback_action = "【防御降级】：主人下山，停止加仓/仅观察"

