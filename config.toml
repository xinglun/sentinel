version = 1

[output]
timezone = "Asia/Tokyo"
format = "markdown"
save_to = "./reports"
include_summary = true
weight_kind = "portfolio" # portfolio, cap, risk

[telegram]
enabled = true
bot_token = "8613115746:AAFqi8RrP6eGNKPdOmazv_kAI70CnSTnCV0"
chat_id = "8442596122"


[rules.trend]
lookback_days = 20
flat_threshold_pct = 0.5 # [-0.5%, +0.5%] は横ばいと見なす

[rules.deviation_bands]
# 段階的な下限閾値 (>=命中)
overheat_2 = 30.0   
overheat_1 = 15.0   
cruise     = 5.0    
optimal    = -5.0   
pullback   = -15.0  
fear_1     = -25.0  

[rules.actions]
# デフォルトのグローバル文案。個別株（積み立て以外）を想定しています。
overheat_2 = "【利确】保有現金比率を急増させ警戒(Cash 50%+)"
overheat_1 = "【部分利确】買いを半分にし、一部利確を検討(Cash 30%+)"
cruise     = "【定投】計画通りに買い増しを継続(Cash 10%)"
optimal    = "【効率定投】絶好のポジション、積極的に買い増し(Cash 5%)"
pullback   = "【押し目買い】適度に買い増し、ポジション構築(Cash 0%)"
fear_1     = "【極度恐慌1】バッファキャッシュを投入して逆張り(Exemption)"
fear_2     = "【極度恐慌2】極端な反発の機会、キャッシュ全投入(Exemption)"

[rules.bear_mode]
enabled = true
buffer_pct = 3.0
confirm_days = 5
confirm_threshold = 3
recover_days = 5
recover_threshold = 3
fallback_action = "【防御 (DEFEND)】：長期トレンド崩壊。現金保有率を最大限上げ(Cash 80%+)、観測のみ"
caution_action = "【警戒 (CAUTION)】：中期調整中。定投継続(Cash 20%)"

