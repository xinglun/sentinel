version = 1

[output]
# 支持 "zh-cn" (默认), "en-us", "ja-jp"
language = "ja-jp" 
timezone = "Asia/Tokyo"
format = "markdown"
save_to = "./reports"
weight_kind = "portfolio" # portfolio, cap, risk

[telegram]
enabled = false
# bot_token 和 chat_id 建议通过环境变量(TELEGRAM_BOT_TOKEN)提供，以保障安全
bot_token = ""
chat_id = ""

[futu]
opend_ip = "127.0.0.1"      # Moomoo/Futu OpenD 运行的本地 IP
opend_port = 11111          # Moomoo/Futu OpenD 使用的 TCP 端口
trd_env = 1                 # 0: 真实实盘 (Real), 1: 模拟炒股环境 (Simulate)
market = 2                  # 交易市场 (1: HK, 2: US, 3: SH, 4: SZ)
# 注意：交易账户 ID 和交易解锁密码应通过环境变量 FUTU_ACC_ID 和 FUTU_UNLOCK_PASSWORD_MD5 配置，防止泄露。

[trading]
enabled = false             # 算法自动交易总开关，默认关闭请手动开启
global_budget = 100000.0    # 全局自动交易预算上限 (等值美元/港币，视主账号而定)
[rules.trend]
lookback_days = 20
flat_threshold_pct = 0.5 # [-0.5%, +0.5%] 区间视为平盘

[rules.deviation_bands]
# 阶梯式下限阈值 (>= 则命中)
overheat_2 = 30.0   
overheat_1 = 15.0   
cruise     = 5.0    
optimal    = -5.0   
pullback   = -15.0  
fear_1     = -25.0  

[rules.actions]
# 默认全局文案。适用于常规个股：
overheat_2 = "【利确】警惕极端背驰，大幅增加现金储备 (Cash 50%+)"
overheat_1 = "【部分利确】买入减半，分批锁定利润 (Cash 30%+)"
cruise     = "【定投】趋势延续，按计划持续买入 (Cash 10%)"
optimal    = "【效率定投】极优仓位，保持高效配置 (Cash 5%)"
pullback   = "【回撤买入】趋势内回调，适度补仓 (Cash 0%)"
fear_1     = "【极度恐慌 🛡️】使用备用资金进行防御性逆势部署 (Exemption)"
fear_2     = "【极度恐慌 🆘】回归概率极大，果断部署现金 (Exemption)"
regime_forming = "【观察期】：引力结构尚未形成，暂不参与"

[rules.sizing_multipliers]
optimal = 1.0
cruise = 1.0
pullback = 0.5
fear_1 = 1.5
fear_2 = 2.0
overheat_1 = 0.5
overheat_2 = 0.0
DEFEND = 0.0
fear_downtrend = 0.0
CAUTION = 0.0


[[watchlist]]
symbol = "TSLA"
market = "US"
owner_ma_days = 120
leash_ma_days = 20
deviation_basis = "owner"
enable = true
trade_enabled = true       # 允许 Sentinel 对这只股票发出自动买卖指令
trade_amount = 5000.0      # 触发买点时（如 pullback, optimal），单笔购入基础金额 (USD)

