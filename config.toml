version = 1 # 配置版本号

[output]
language = "zh-cn"         # 报表语言，可选 "zh-cn" / "en-us" / "ja-jp"
timezone = "Asia/Tokyo"    # 输出使用的时区
format = "markdown"        # 主要归档格式
save_to = "./reports"      # 报表输出目录
weight_kind = "portfolio"  # 权重口径，可选 portfolio / cap / risk
compact_transition_evidence_in_no_trade = true # NO TRADE 时前台是否压缩“状态转移证据”展开（归档仍保留完整细节）

[telegram]
enabled = false            # Telegram 推送总开关；若环境变量提供 token，则运行时会自动启用
bot_token = ""             # Telegram Bot Token，建议改用环境变量 TELEGRAM_BOT_TOKEN 提供
chat_id = ""               # Telegram Chat ID，建议改用环境变量 TELEGRAM_CHAT_ID 提供

[futu]
opend_ip = "127.0.0.1"     # Moomoo/Futu OpenD 的本地 IP
opend_port = 11111         # Moomoo/Futu OpenD 的 TCP 端口
trd_env = 1                # 交易环境，0=真实实盘，1=模拟盘
market = 2                 # 市场编号，1=HK，2=US，3=SH，4=SZ

[trading]
enabled = false            # 自动交易总开关，默认关闭
global_budget = 100000.0   # 自动交易全局预算上限

# --- Phase 6: Evidence Ingestion (本格稼働対応) ---

[sec]
# SEC EDGAR 访问配置
# 必须遵循 "Company Name <email@example.com>" 格式以符合 SEC 访问政策。
# 建议通过环境变量 SEC_USER_AGENT 提供以保持隐私。
user_agent = "Ray Sentinel <xing_lun@hotmail.com>"

[fred]
fred_api_key = "89e3dbb609204b540b3c35dc19a97bf9"

[finnhub]
# Finnhub 访问配置
# 建议通过环境变量 FINNHUB_API_KEY 提供。
finnhub_api_key = "d6gp00hr01qg85gvhl00d6gp00hr01qg85gvhl0g"

[rules.market_state_engine]
# 证据摄取与计算规则
# 证据的时间衰减半衰期或线性衰减参数（天）
evidence_decay_days = 5
evidence_retention_days = 3650
# 证据对确信度得分的基础贡献权重（按类型）
# 格式：type = weight (0.0 - 5.0)
capex_payoff_weight = 2.0
earnings_validation_weight = 1.5
order_visibility_weight = 1.0

[rules.trend]
lookback_days = 20         # 趋势识别回看天数
flat_threshold_pct = 0.5   # 平盘阈值，[-0.5%, +0.5%] 视为平盘

[rules.deviation_bands]
overheat_2 = 30.0          # 极端过热区阈值，>= 即命中
overheat_1 = 15.0          # 过热区阈值，>= 即命中
cruise = 5.0               # 巡航区阈值，>= 即命中
optimal = -5.0             # 最优区阈值，>= 即命中
pullback = -15.0           # 回撤区阈值，>= 即命中
fear_1 = -25.0             # 恐慌区第一档阈值，>= 即命中

[rules.actions]
overheat_2 = "【利确】警惕极端背驰，大幅增加现金储备 (Cash 50%+)"        # 极端过热时的默认动作文案
overheat_1 = "【部分利确】买入减半，分批锁定利润 (Cash 30%+)"              # 过热时的默认动作文案
cruise = "【定投】趋势延续，按计划持续买入 (Cash 10%)"                     # 巡航状态的默认动作文案
optimal = "【效率定投】极优仓位，保持高效配置 (Cash 5%)"                   # 最优状态的默认动作文案
pullback = "【回撤买入】趋势内回调，适度补仓 (Cash 0%)"                    # 回撤状态的默认动作文案
fear_1 = "【极度恐慌 🛡️】使用备用资金进行防御性逆势部署 (Exemption)"       # 恐慌状态第一档文案
fear_2 = "【极度恐慌 🆘】回归概率极大，果断部署现金 (Exemption)"            # 恐慌状态第二档文案
regime_forming = "【观察期】：引力结构尚未形成，暂不参与"                  # 主状态仍在形成中的默认文案

[rules.sizing_multipliers]
optimal = 1.0              # 最优状态的仓位倍率
cruise = 1.0               # 巡航状态的仓位倍率
pullback = 0.5             # 回撤状态的仓位倍率
fear_1 = 1.5               # 恐慌第一档的仓位倍率
fear_2 = 2.0               # 恐慌第二档的仓位倍率
overheat_1 = 0.5           # 过热第一档的仓位倍率
overheat_2 = 0.0           # 极端过热时禁止新增风险
DEFEND = 0.0               # 防守状态的仓位倍率
fear_downtrend = 0.0       # 下跌恐慌豁免场景的仓位倍率
CAUTION = 0.0              # 谨慎状态的仓位倍率

[rules.trend_cohesion]
history_window_days = 2                 # 回看多少个历史 packet 来判断 leader 重复和成员 churn
stability_norm_max = 15.0               # stability 分数归一化上限，仅影响 cohesion score 映射
continuity_norm_max = 4                 # continuity 天数归一化上限，仅影响 cohesion score 映射
severe_stability_threshold = 8.0        # 低于该稳定性时，主线更容易被判为严重碎片化
severe_continuity_threshold = 2         # 低于该连续性时，主线更容易被判为严重碎片化
severe_compactness_threshold = 45.0     # 候选紧凑度低于该值时，视为严重发散
severe_rotation_threshold = 35.0        # 轮动质量低于该值时，视为严重无序切换
severe_leadership_threshold = 45.0      # 领涨质量低于该值时，视为缺乏领导者
severe_cohesion_threshold = 45.0        # cohesion 总分低于该值时，直接偏向 NotFormed
topology_single_max_candidates = 3      # 识别“单主线”时允许的最大候选数量
topology_single_min_compactness = 65.0  # 识别“单主线”时要求的最小候选紧凑度
topology_single_min_rotation = 30.0     # 识别“单主线”时要求的最小轮动质量
cohesive_score_threshold = 75.0         # 通过硬条件后，升级为 Cohesive 所需的最小总分

[rules.breakout]
confirmed_trend_age_threshold = 8       # 结构性突破确认所需的最小趋势年龄
confirmed_top_tier_streak_threshold = 3 # 结构性突破确认所需的最小 top tier 连续天数
confirmed_zscore_threshold = 1.2        # 结构性突破确认所需的最小 z-score
confirmed_min_slope = 0.0               # 结构性突破确认所需的最小 slope
confirmed_min_curvature = -0.2          # 结构性突破确认所需的最小 curvature
emerging_trend_age_threshold = 5        # 突破萌芽所需的最小趋势年龄
emerging_top_tier_streak_threshold = 1  # 突破萌芽所需的最小 top tier 连续天数
emerging_zscore_threshold = 0.5         # 突破萌芽所需的最小 z-score
emerging_min_slope = 0.0                # 突破萌芽所需的最小 slope
failed_breakout_curvature_threshold = -0.5 # 假突破风险判定的 curvature 下限
failed_breakout_slope_threshold = 0.0   # 假突破风险判定的 slope 下限
failed_breakout_display_threshold = 55.0 # 失败突破风险高于该值时才在展示层显式输出
failed_breakout_no_trade_display_threshold = 70.0 # NO TRADE 场景下仅展示高于该值的失败突破风险，避免基础风险刷屏

