name: Weekly Sentinel Backtest

on:
  schedule:
    # Runs Friday 16:00 UTC (Saturday 01:00 JST)
    - cron: '0 16 * * 5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-backtest-data-branch
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TZ: Asia/Tokyo

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}
          ref: main

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/registry/src/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Fetch Historical Telemetry (Optional)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p reports
          
          # Try to steal telemetry.csv from historical records (depth=1 is enough for tip)
          if git fetch --depth=1 origin refs/heads/data:refs/remotes/origin/data; then
            echo "Data branch exists. Fetching telemetry.csv..."
            if git cat-file -e origin/data:reports/telemetry.csv 2>/dev/null; then
              git show origin/data:reports/telemetry.csv > reports/telemetry.csv
              echo "✅ telemetry.csv restored from data branch ($(wc -l < reports/telemetry.csv) lines)"
            else
              echo "⚠️ telemetry.csv not found in data branch"
            fi
          else
            echo "⚠️ Could not fetch data branch (branch missing OR auth/network issue). Will continue with empty telemetry.csv."
          fi

          # Fail-safe: if the file still doesn't exist, create a dummy header so Rust doesn't panic
          if [ ! -f reports/telemetry.csv ]; then
            echo "date,timestamp,config_hash,state_code,state_text,gravity_strength,gravity_potential,t_share_raw,r_share_raw,r_share_adj,t_ratio_final,r_ratio_final,dominance_margin,exposure,watchlist_size,count_up_share,count_flat_share,count_down_share,count_forming_share,weight_up_share,weight_flat_share,weight_down_share,weight_forming_share,universe_integrity,capital_flow_acceleration" > reports/telemetry.csv
            echo "⚠️ Created empty telemetry.csv with headers to prevent Rust panic."
          fi

      - name: Run Sentinel Backtest
        run: |
          echo "RUN_AT_JST=$(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_ENV
          echo "REPORT_DATE_JST=$(TZ=Asia/Tokyo date +%Y-%m-%d)" >> $GITHUB_ENV
          cargo run --release -- backtest

      - name: Snapshot Backtest Summary (latest + archive)
        run: |
          set -euo pipefail
          DATE_JST="${REPORT_DATE_JST:-$(TZ=Asia/Tokyo date +%Y-%m-%d)}"

          # Ensure source exists
          test -s backtest/summary.md

          # 1) latest pointer (overwrite)
          cp -f backtest/summary.md backtest/summary_latest.md

          # 2) archive (immutable snapshot)
          mkdir -p backtest/archive
          ARCHIVE_PATH="backtest/archive/summary_${DATE_JST}.md"
          if [ -f "${ARCHIVE_PATH}" ]; then
            echo "⚠️ Archive already exists: ${ARCHIVE_PATH} (keeping existing, not overwriting)"
          else
            cp backtest/summary.md "${ARCHIVE_PATH}"
            echo "✅ Archived: ${ARCHIVE_PATH}"
          fi

      - name: Output Integrity Check
        run: |
          set -euo pipefail
          
          # CRITICAL: Backtest must produce the summary markdown
          if [ ! -s "backtest/summary.md" ] || [ ! -s "backtest/summary_latest.md" ]; then
            echo "❌ CRITICAL: backtest summary missing or empty!"
            exit 1
          fi
          
      - name: Commit and Push to Data Worktree
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          ROOT_DIR="${GITHUB_WORKSPACE}"
          DATA_DIR="${ROOT_DIR}/../data_worktree"

          # 1. Ensure origin/data history exists locally
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=50 origin refs/heads/data:refs/remotes/origin/data
          else
            echo "Remote data branch not found; will initialize."
          fi

          # Clean any stale worktree state (paranoia mode: destroy abandoned locks)
          git worktree remove --force ../data_worktree 2>/dev/null || true
          git worktree prune || true
          rm -rf ../data_worktree || true

          # 2. Create isolated worktree for data branch
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            echo "Remote data branch found. Fetching..."
            git fetch origin refs/heads/data:refs/remotes/origin/data
            git worktree add "${DATA_DIR}" -B data origin/data
          else
            echo "Remote data branch not found. Initializing orphan branch..."
            git worktree add --detach "${DATA_DIR}"
            cd "${DATA_DIR}"
            git checkout --orphan data
            git rm -rf . >/dev/null 2>&1 || true
            git branch -M data

            echo "# Sentinel data branch" > README.md
            echo "- reports/: daily radar outputs" >> README.md
            echo "- backtest/: weekly calibration & alpha separation" >> README.md
            mkdir -p reports backtest/archive
            git add -A
            git commit -m "init data branch"

            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" 2>/dev/null || true
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin data
            cd "${GITHUB_WORKSPACE}"

            # Re-add worktree now that remote exists
            rm -rf "${DATA_DIR}"
            git worktree add "${DATA_DIR}" -B data origin/data
          fi

          # 3. Port over generated reports cleanly
          cd "${GITHUB_WORKSPACE}"
          mkdir -p "${DATA_DIR}/reports" "${DATA_DIR}/backtest/archive"
          
          echo "PWD=$(pwd)"
          echo "ROOT_DIR=${ROOT_DIR}"
          echo "DATA_DIR=${DATA_DIR}"
          echo "About to run: rsync -a --delete ${GITHUB_WORKSPACE}/reports/ ${DATA_DIR}/reports/"
          
          rsync -a --delete "${ROOT_DIR}/reports/" "${DATA_DIR}/reports/"
          rsync -a "${ROOT_DIR}/backtest/summary_latest.md" "${DATA_DIR}/backtest/"
          rsync -a "${ROOT_DIR}/backtest/archive/" "${DATA_DIR}/backtest/archive/"
          
          # 4. Hop into worktree, commit and push
          cd "${DATA_DIR}"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout data || true
          
          # Minimize --force-with-lease failures by rebasing against latest remote state
          # Uniform refspec for maximum stability
          git fetch origin refs/heads/data:refs/remotes/origin/data || true
          git pull --rebase origin data || true

          git add -f reports/ backtest/
          
          if ! git diff --cached --quiet; then
            echo "Pushing update to: $(git remote get-url origin | sed -e 's/x-access-token:.*@/x-access-token:***@/')"
            git commit -m "Stock Sentinel Weekly Backtest: ${RUN_AT_JST:-$(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M:%S %Z')}"
            # Protect history with lease, fallback to rebase retry if concurrent write detected
            git push origin data --force-with-lease || (git pull --rebase origin data && git push origin data --force-with-lease)
          else
            echo "No changes to commit in data branch from backtest."
          fi

      - name: Notify on Failure
        if: failure()
        run: |
          # Use ANSI-C quoting for real newlines in Telegram
          MSG=$'❌ Weekly Backtest FAILED on '"${GITHUB_REPOSITORY}"$'\n'
          MSG+=$'Workflow: '"${GITHUB_WORKFLOW}"$'\n'
          MSG+=$'Run: '"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"$'\n'
          MSG+=$'Commit: '"${GITHUB_SHA::7}"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${MSG}" > /dev/null || echo "Failed to send Telegram notification"
