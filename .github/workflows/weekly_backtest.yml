name: Weekly Sentinel Backtest

on:
  schedule:
    # Runs Friday 16:00 UTC (Saturday 01:00 JST)
    - cron: '0 16 * * 5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-backtest-data-branch
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TZ: Asia/Tokyo
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ github.token }}
          ref: main

      - name: "Debug: Show runtime context"
        run: |
          set -euo pipefail
          echo "=== RUNTIME CONTEXT ==="
          echo "workflow=${GITHUB_WORKFLOW}"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          echo "actor=${GITHUB_ACTOR}"
          echo "workspace=${GITHUB_WORKSPACE}"
          pwd
          ls -la
          echo "workflows:"
          ls -la .github/workflows || true
          echo "weekly_backtest.yml (first 60 lines):"
          sed -n '1,60p' .github/workflows/weekly_backtest.yml || true
          echo "======================="

      - name: Install Protoc (Required for Futu)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/registry/src/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Restore Historical Reports Context (Optional)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf reports
          mkdir -p reports
          
          # Restore the full reports/ tree from the data branch so weekly backtests do not
          # delete daily archival history or append-only audit logs when syncing with --delete.
          if git fetch --depth=1 origin refs/heads/data:refs/remotes/origin/data; then
            echo "Data branch exists. Restoring reports/ context..."
            if git cat-file -e origin/data:reports 2>/dev/null; then
              git archive --format=tar origin/data reports | tar -xf -
              REPORT_FILE_COUNT="$(find reports -type f | wc -l | tr -d ' ')"
              echo "✅ reports/ restored from data branch (${REPORT_FILE_COUNT} files)"
            else
              echo "⚠️ reports/ not found in data branch"
            fi
          else
            echo "⚠️ Could not fetch data branch (branch missing OR auth/network issue). Will continue with empty reports/ context."
          fi

          # Fail-safe: if telemetry.csv still doesn't exist, create a dummy header so Rust doesn't panic.
          if [ ! -f reports/telemetry.csv ]; then
            echo "timestamp,date,provider,market_state,risk_overlay,system_confidence,stability_score,dominance_margin,potential_energy,regime_age,up_count,flat_count,down_count,total_count,up_weight,flat_weight,down_weight,total_weight,config_hash,data_quality_status" > reports/telemetry.csv
            echo "⚠️ Created empty telemetry.csv with headers to prevent Rust panic."
          fi

      - name: Run Sentinel Backtest
        run: |
          echo "RUN_AT_JST=$(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_ENV
          echo "REPORT_DATE_JST=$(TZ=Asia/Tokyo date +%Y-%m-%d)" >> $GITHUB_ENV
          make backtest-release

      - name: Snapshot Backtest Summary (latest + archive)
        run: |
          set -euo pipefail
          DATE_JST="${REPORT_DATE_JST:-$(TZ=Asia/Tokyo date +%Y-%m-%d)}"

          # Ensure source exists
          test -s backtest/summary.md

          # 1) latest pointer (overwrite)
          cp -f backtest/summary.md backtest/summary_latest.md

          # 2) archive (immutable snapshot)
          mkdir -p backtest/archive
          ARCHIVE_PATH="backtest/archive/summary_${DATE_JST}.md"
          if [ -f "${ARCHIVE_PATH}" ]; then
            echo "⚠️ Archive already exists: ${ARCHIVE_PATH} (keeping existing, not overwriting)"
          else
            cp backtest/summary.md "${ARCHIVE_PATH}"
            echo "✅ Archived: ${ARCHIVE_PATH}"
          fi

          # 3) metrics archive
          cp -f backtest/state_machine_metrics.md backtest/state_machine_metrics_latest.md
          cp -f backtest/state_machine_metrics.json backtest/state_machine_metrics_latest.json
          cp backtest/state_machine_metrics.md "backtest/archive/state_machine_metrics_${DATE_JST}.md"
          cp backtest/state_machine_metrics.json "backtest/archive/state_machine_metrics_${DATE_JST}.json"

      - name: Output Integrity Check
        run: |
          set -euo pipefail
          
          # CRITICAL: Backtest must produce the summary markdown
          REQUIRED_FILES=(
            "backtest/summary.md"
            "backtest/summary_latest.md"
            "backtest/state_machine_metrics.json"
            "backtest/state_machine_metrics.md"
          )
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -s "$file" ]; then
              echo "❌ CRITICAL: Required archival asset $file is missing or empty!"
              exit 1
            fi
          done
      - name: Commit and Push to Data Worktree
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          ROOT_DIR="${GITHUB_WORKSPACE}"
          DATA_DIR="${ROOT_DIR}/.worktrees/data"

          # Clean any stale worktree state (paranoia mode: destroy abandoned locks)
          git worktree remove --force "${DATA_DIR}" 2>/dev/null || true
          git worktree prune || true
          rm -rf "${DATA_DIR}" || true
          mkdir -p "$(dirname "${DATA_DIR}")"

          # 1. ensure data branch exists; if not, create & push once
          if ! git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            echo "Remote data branch not found. Bootstrapping..."

            git worktree add --detach "${DATA_DIR}"
            cd "${DATA_DIR}"
            git checkout --orphan data
            git rm -rf . >/dev/null 2>&1 || true
            git branch -M data

            echo "# Sentinel data branch" > README.md
            echo "- reports/: daily radar outputs" >> README.md
            echo "- backtest/: weekly calibration & alpha separation" >> README.md
            mkdir -p reports backtest/archive
            git add -A
            git commit -m "init data branch"

            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" 2>/dev/null || true
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin data

            cd "${ROOT_DIR}"
            git worktree remove --force "${DATA_DIR}" 2>/dev/null || true
            rm -rf "${DATA_DIR}" || true
          fi

          # 2. Add worktree from remote data
          git fetch origin refs/heads/data:refs/remotes/origin/data
          git worktree add "${DATA_DIR}" -B data origin/data

          # 3. Hop into worktree and pull latest state BEFORE modifying files
          cd "${DATA_DIR}"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout data
          
          # Minimize --force-with-lease failures by rebasing against latest remote state
          # Uniform refspec for maximum stability
          git fetch origin refs/heads/data:refs/remotes/origin/data
          git pull --rebase origin data

          # 4. Port over generated reports cleanly
          cd "${ROOT_DIR}"
          mkdir -p "${DATA_DIR}/reports" "${DATA_DIR}/backtest/archive"
          
          echo "PWD=$(pwd)"
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
          echo "DATA_DIR=${DATA_DIR}"
          ls -la "${ROOT_DIR}/reports" || true
          
          if [ -f "${ROOT_DIR}/reports/decision_history.jsonl" ] && [ -f "${ROOT_DIR}/reports/state_transitions.jsonl" ]; then
            make -C "${ROOT_DIR}" prune-data-history PRUNE_DATA_HISTORY_ARGS="--reports-dir ${ROOT_DIR}/reports"
          elif [ ! -e "${ROOT_DIR}/reports/decision_history.jsonl" ] && [ ! -e "${ROOT_DIR}/reports/state_transitions.jsonl" ]; then
            echo "ℹ️ No radar history exists yet; skipping history cleanup for initial backtest bootstrap."
          else
            echo "❌ Radar history is partially missing; refusing to mirror incomplete data."
            exit 1
          fi
          rsync -a --delete "${ROOT_DIR}/reports/" "${DATA_DIR}/reports/"
          rsync -a "${ROOT_DIR}/backtest/summary_latest.md" "${DATA_DIR}/backtest/"
          rsync -a "${ROOT_DIR}/backtest/state_machine_metrics_latest.md" "${DATA_DIR}/backtest/"
          rsync -a "${ROOT_DIR}/backtest/state_machine_metrics_latest.json" "${DATA_DIR}/backtest/"
          rsync -a "${ROOT_DIR}/backtest/archive/" "${DATA_DIR}/backtest/archive/"
          
          # 5. Commit and push
          cd "${DATA_DIR}"
          git add -f reports/ backtest/
          
          if ! git diff --cached --quiet; then
            echo "Pushing update to: $(git remote get-url origin | sed -e 's/x-access-token:.*@/x-access-token:***@/')"
            git commit -m "Stock Sentinel Weekly Backtest: ${RUN_AT_JST:-$(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M:%S %Z')}"
            # Protect history with lease, fallback to rebase retry if concurrent write detected
            git push origin data --force-with-lease || (git pull --rebase origin data && git push origin data --force-with-lease)
          else
            echo "No changes to commit in data branch from backtest."
          fi

      - name: Notify on Failure
        if: failure()
        run: |
          # Use ANSI-C quoting for real newlines in Telegram
          MSG=$'❌ Weekly Backtest FAILED on '"${GITHUB_REPOSITORY}"$'\n'
          MSG+=$'Workflow: '"${GITHUB_WORKFLOW}"$'\n'
          MSG+=$'Run: '"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"$'\n'
          MSG+=$'Commit: '"${GITHUB_SHA::7}"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${MSG}" > /dev/null || echo "Failed to send Telegram notification"
