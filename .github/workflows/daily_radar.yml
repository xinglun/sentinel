name: Daily Decision Radar

on:
  schedule:
    # 每天 日本时间 22:30 运行 (对应 UTC 13:30)
    - cron: '30 13 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main # 确保在 main 分支运行并提交

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Sentinel Radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: cargo run --release

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f reports/telemetry.csv
          git add -f reports/$(date +%Y-%m-%d).json
          git add -f reports/$(date +%Y-%m-%d).md
          # 检查是否有变化
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Stock Sentinel Observation: $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin main
          else
            echo "No changes to commit."
          fi
