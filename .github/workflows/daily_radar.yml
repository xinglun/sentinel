name: Daily Decision Radar

on:
  schedule:
    # 每周一至周五 日本时间 23:30 运行 (对应 UTC 14:30)
    - cron: '30 14 * * 1-5'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

concurrency:
  group: daily-radar-data-branch
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ github.token }}
          ref: main # 确保在 main 分支运行并提交

      - name: "Debug: Show runtime context"
        run: |
          set -euo pipefail
          echo "=== RUNTIME CONTEXT ==="
          echo "workflow=${GITHUB_WORKFLOW}"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          echo "actor=${GITHUB_ACTOR}"
          echo "workspace=${GITHUB_WORKSPACE}"
          pwd
          ls -la
          echo "workflows:"
          ls -la .github/workflows || true
          echo "daily_radar.yml (first 60 lines):"
          sed -n '1,60p' .github/workflows/daily_radar.yml || true
          echo "======================="

      - name: Install Protoc (Required for Futu)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/registry/src/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Restore Historical Reports Context
        run: |
          set -euo pipefail
          rm -rf reports
          mkdir -p reports
          
          # Restore the full reports/ tree from the data branch so runtime history,
          # append-only logs, and daily snapshots remain continuous across fresh CI runs.
          if git fetch --depth=1 origin refs/heads/data:refs/remotes/origin/data; then
            echo "Data branch exists. Restoring reports/ context..."
            if git cat-file -e origin/data:reports 2>/dev/null; then
              git archive --format=tar origin/data reports | tar -xf -
              REPORT_FILE_COUNT="$(find reports -type f | wc -l | tr -d ' ')"
              echo "✅ reports/ restored from data branch (${REPORT_FILE_COUNT} files)"
            else
              echo "⚠️ reports/ not found in data branch"
            fi
          else
            echo "⚠️ Could not fetch data branch (branch missing OR auth/network issue). Will continue with empty reports/ context."
          fi

          # Fail-safe: if telemetry.csv still doesn't exist, create a dummy header so Rust doesn't panic.
          if [ ! -f reports/telemetry.csv ]; then
            echo "timestamp,date,provider,market_state,risk_overlay,system_confidence,stability_score,dominance_margin,potential_energy,regime_age,up_count,flat_count,down_count,total_count,up_weight,flat_weight,down_weight,total_weight,config_hash,data_quality_status" > reports/telemetry.csv
            echo "⚠️ Created empty telemetry.csv with headers to prevent Rust panic."
          fi

      - name: Collect Evidence (non-blocking)
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          EVIDENCE_DAYS: "7"
        run: |
          set -euo pipefail
          mkdir -p reports
          STATUS_PATH="reports/evidence_collection_status_latest.json"
          export STATUS_PATH

          write_status() {
            export EVIDENCE_STATUS="$1"
            export EVIDENCE_REASON="${2:-}"
            python - <<'PY'
          import json
          import os

          symbols = [s for s in os.environ.get("EVIDENCE_SYMBOLS", "").split(",") if s]
          payload = {
              "status": os.environ["EVIDENCE_STATUS"],
              "reason": os.environ.get("EVIDENCE_REASON") or None,
              "symbols": symbols,
              "days": int(os.environ.get("EVIDENCE_DAYS", "7")),
          }
          with open(os.environ["STATUS_PATH"], "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)
              f.write("\n")
          PY
          }

          trap 'code=$?; write_status "failed" "unexpected evidence collection step error (exit ${code})"; echo "⚠️ Evidence collection failed before completion but radar will continue."; exit 0' ERR

          EVIDENCE_SYMBOLS="$(python - <<'PY'
          import tomllib

          with open("config.toml", "rb") as f:
              config = tomllib.load(f)

          symbols = [
              item["symbol"]
              for item in config.get("watchlist", [])
              if item.get("enable", True) and item.get("symbol")
          ]
          print(",".join(symbols))
          PY
          )"
          export EVIDENCE_SYMBOLS

          if [ -z "${EVIDENCE_SYMBOLS}" ]; then
            write_status "skipped" "watchlist symbols are empty"
            echo "ℹ️ Evidence collection skipped: watchlist symbols are empty."
            exit 0
          fi

          if [ -z "${FINNHUB_API_KEY:-}" ]; then
            write_status "skipped" "FINNHUB_API_KEY is not configured"
            echo "ℹ️ Evidence collection skipped: FINNHUB_API_KEY is not configured."
            exit 0
          fi

          OUTPUT_FILE="$(mktemp)"
          set +e
          make collect-evidence-release COLLECT_EVIDENCE_ARGS="--symbols ${EVIDENCE_SYMBOLS} --days ${EVIDENCE_DAYS}" >"${OUTPUT_FILE}" 2>&1
          EXIT_CODE=$?
          set -e
          cat "${OUTPUT_FILE}"

          if [ "${EXIT_CODE}" -eq 0 ]; then
            write_status "succeeded" ""
            echo "✅ Evidence collection completed."
          else
            REASON="$(tail -n 20 "${OUTPUT_FILE}" | tr '\n' ' ' | cut -c1-1000)"
            write_status "failed" "${REASON}"
            echo "⚠️ Evidence collection failed but radar will continue."
          fi

      - name: Run Sentinel Radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          set -euo pipefail
          echo "RUN_AT_JST=$(date +'%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_ENV
          make radar-release

          REPORT_PACKET_PATH="$(find reports -maxdepth 1 -type f -name 'decision_packet_*.json' | sort | tail -n 1)"
          if [ -z "${REPORT_PACKET_PATH}" ]; then
            echo "❌ Could not determine report date: no decision_packet_*.json generated."
            exit 1
          fi

          REPORT_DATE="$(basename "${REPORT_PACKET_PATH}" | sed -E 's/^decision_packet_([0-9]{4}-[0-9]{2}-[0-9]{2})\.json$/\1/')"
          if [ -z "${REPORT_DATE}" ]; then
            echo "❌ Could not parse report date from ${REPORT_PACKET_PATH}."
            exit 1
          fi

          echo "REPORT_DATE_JST=${REPORT_DATE}" >> $GITHUB_ENV
          echo "✅ Report date resolved from generated packet: ${REPORT_DATE}"

      - name: Show Notification Outcome
        run: |
          set -euo pipefail

          DATE_JST="${REPORT_DATE_JST:-$(TZ=Asia/Tokyo date +%Y-%m-%d)}"
          RUN_STATUS_PATH="reports/run_status_${DATE_JST}.json"

          if [ ! -f "${RUN_STATUS_PATH}" ]; then
            echo "⚠️ run_status not found yet: ${RUN_STATUS_PATH}"
            exit 0
          fi

          python - <<'PY'
          import json
          import os
          path = os.path.join("reports", f"run_status_{os.environ.get('REPORT_DATE_JST')}.json")
          data = json.load(open(path))
          notification = data.get("notification", "missing")
          print("=== NOTIFICATION OUTCOME ===")
          if isinstance(notification, str):
              print(f"status={notification}")
          elif isinstance(notification, dict):
              if "failed" in notification:
                  print("status=failed")
                  print(f"reason={notification['failed'].get('reason', '')}")
              elif "skipped" in notification:
                  print("status=skipped")
              elif "succeeded" in notification:
                  print("status=succeeded")
              else:
                  print(f"status={notification}")
          else:
              print(f"status={notification}")
          print("============================")
          PY

      - name: Freshness Gate and Output Validation
        run: |
          set -euo pipefail
          
          DATE_JST="${REPORT_DATE_JST:-$(TZ=Asia/Tokyo date +%Y-%m-%d)}"
          
          # 1. Output Integrity Checks (Prevent pushing empty/failed reports)
          REQUIRED_FILES=(
            "reports/${DATE_JST}.md"
            "reports/decision_packet_${DATE_JST}.json"
            "reports/decision_history.jsonl"
            "reports/state_transitions.csv"
            "reports/state_transitions.jsonl"
            "reports/execution_gate_log.jsonl"
            "reports/portfolio_snapshot_${DATE_JST}.json"
            "reports/account_snapshot_${DATE_JST}.json"
            "reports/data_quality_log.jsonl"
            "reports/run_status_${DATE_JST}.json"
            "reports/evidence_collection_status_latest.json"
            "reports/weekly_state_metrics.json"
            "reports/weekly_state_review_auto.md"
            "reports/telemetry.csv"
          )
          
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -s "$file" ]; then
              echo "❌ CRITICAL: Required archival asset $file is missing or empty!"
              exit 1
            fi
          done

          # Evidence records are append-only but can legitimately be empty
          # on days with no extracted substantive evidence.
          touch "reports/evidence_records.jsonl"
          
          echo "✅ Required archival assets verified."

          
          # 2. Freshness Gate Logic
          if [ -f "reports/freshness.json" ]; then
            echo "freshness.json found, validating..."
            python - <<'PY'
          import json, sys, pathlib
          p="reports/freshness.json"
          try:
              d=json.load(open(p))
              stale=d.get("stale", False)
              max_age=d.get("max_age_minutes", None)
              if stale:
                  print(f"⚠️ STALE: max_age_minutes={max_age} (continuing, but marking run)")
                  pathlib.Path("reports/STALE_RUN").write_text(f"stale max_age_minutes={max_age}\n")
              else:
                  print(f"✅ Freshness OK (max_age={max_age}m).")
          except Exception as e:
              print(f"⚠️ Error checking freshness: {e}")
          PY
          else
            echo "⚠️ No freshness.json; skipping gate."
          fi

      - name: Commit and Push to Data Worktree
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          ROOT_DIR="${GITHUB_WORKSPACE}"
          DATA_DIR="${ROOT_DIR}/.worktrees/data"
          DATE_JST="${REPORT_DATE_JST:-$(TZ=Asia/Tokyo date +%Y-%m-%d)}"

          # Clean any stale worktree state (paranoia mode: destroy abandoned locks)
          git worktree remove --force "${DATA_DIR}" 2>/dev/null || true
          git worktree prune || true
          rm -rf "${DATA_DIR}" || true
          mkdir -p "$(dirname "${DATA_DIR}")"

          # 1. ensure data branch exists; if not, create & push once
          if ! git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            echo "Remote data branch not found. Bootstrapping..."

            git worktree add --detach "${DATA_DIR}"
            cd "${DATA_DIR}"
            git checkout --orphan data
            git rm -rf . >/dev/null 2>&1 || true
            git branch -M data

            echo "# Sentinel data branch" > README.md
            mkdir -p reports
            git add -A
            git commit -m "init data branch"

            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" 2>/dev/null || true
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin data

            cd "${ROOT_DIR}"
            git worktree remove --force "${DATA_DIR}" 2>/dev/null || true
            rm -rf "${DATA_DIR}" || true
          fi

          # 2. Add worktree from remote data
          git fetch origin refs/heads/data:refs/remotes/origin/data
          git worktree add "${DATA_DIR}" -B data origin/data

          # 3. Hop into worktree and pull latest state BEFORE modifying files
          cd "${DATA_DIR}"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout data || true
          
          git fetch origin refs/heads/data:refs/remotes/origin/data || true
          git pull --rebase origin data || true

          # 4. Port over generated reports cleanly (Mirror Strategy for snapshots)
          cd "${ROOT_DIR}"
          mkdir -p "${DATA_DIR}/reports"
          
          echo "PWD=$(pwd)"
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
          echo "DATA_DIR=${DATA_DIR}"
          ls -la "${ROOT_DIR}/reports" || true

          rsync -a --delete "${ROOT_DIR}/reports/" "${DATA_DIR}/reports/"
          
          # 5. Commit and push
          cd "${DATA_DIR}"
          git add -f reports/
          
          if ! git diff --cached --quiet; then
            echo "Pushing update to: $(git remote get-url origin | sed -e 's/x-access-token:.*@/x-access-token:***@/')"
            git commit -m "Stock Sentinel Observation: ${RUN_AT_JST:-$(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M:%S %Z')}"
            # Protect history with lease, fallback to rebase retry if concurrent write detected
            git push origin data --force-with-lease || (git pull --rebase origin data && git push origin data --force-with-lease)
          else
            echo "No changes to commit in data branch."
          fi

      - name: Notify on Failure
        if: failure()
        run: |
          # Use ANSI-C quoting for real newlines in Telegram
          MSG=$'❌ Daily Radar FAILED on '"${GITHUB_REPOSITORY}"$'\n'
          MSG+=$'Workflow: '"${GITHUB_WORKFLOW}"$'\n'
          MSG+=$'Run: '"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"$'\n'
          MSG+=$'Commit: '"${GITHUB_SHA::7}"
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${MSG}" > /dev/null || echo "Failed to send Telegram notification"
