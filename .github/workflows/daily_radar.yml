name: Daily Decision Radar

on:
  schedule:
    # 每周一至周五 日本时间 23:30 运行 (对应 UTC 14:30)
    - cron: '30 14 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: "运行方式"
        required: true
        default: generate
        type: choice
        options:
          - generate
          - resend

permissions:
  contents: write

concurrency:
  group: sentinel-data-branch
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ github.token }}
          ref: ${{ github.ref_name }} # 运行触发时的分支代码；schedule 使用默认分支

      - name: "Debug: Show runtime context"
        run: |
          set -euo pipefail
          echo "=== RUNTIME CONTEXT ==="
          echo "workflow=${GITHUB_WORKFLOW}"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          echo "checkout_ref=${GITHUB_REF_NAME}"
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          echo "checked_out_sha=${CHECKED_OUT_SHA}"
          test "${CHECKED_OUT_SHA}" = "${GITHUB_SHA}"
          echo "actor=${GITHUB_ACTOR}"
          echo "workspace=${GITHUB_WORKSPACE}"
          pwd
          ls -la
          echo "workflows:"
          ls -la .github/workflows || true
          echo "daily_radar.yml (first 60 lines):"
          sed -n '1,60p' .github/workflows/daily_radar.yml || true
          echo "======================="

      - name: Install Protoc (Required for Futu)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/registry/src/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Restore Historical Reports Context
        run: |
          set -euo pipefail
          rm -rf reports
          mkdir -p reports
          
          # Restore the full reports/ tree from the data branch so runtime history,
          # append-only logs, and daily snapshots remain continuous across fresh CI runs.
          set +e
          git ls-remote --exit-code --heads origin data >/dev/null 2>&1
          REMOTE_DATA_BRANCH_LOOKUP_STATUS=$?
          set -e
          case "${REMOTE_DATA_BRANCH_LOOKUP_STATUS}" in
            0)
              REMOTE_DATA_BRANCH_EXISTS=true
              ;;
            2)
              REMOTE_DATA_BRANCH_EXISTS=false
              ;;
            *)
              echo "❌ Could not determine whether the remote data branch exists; refusing to continue with empty reports."
              exit 1
              ;;
          esac
          if git fetch --depth=1 origin refs/heads/data:refs/remotes/origin/data; then
            echo "Data branch exists. Restoring reports/ context..."
            if git cat-file -e origin/data:reports 2>/dev/null; then
              git archive --format=tar origin/data reports | tar -xf -
              REPORT_FILE_COUNT="$(find reports -type f | wc -l | tr -d ' ')"
              echo "✅ reports/ restored from data branch (${REPORT_FILE_COUNT} files)"
            else
              echo "❌ Fetched data branch has no reports tree; refusing to continue with empty reports."
              exit 1
            fi
          elif [ "${REMOTE_DATA_BRANCH_EXISTS}" = "true" ]; then
            echo "❌ Existing data branch could not be fetched; refusing to continue with empty reports."
            exit 1
          else
            echo "⚠️ Data branch is absent. Will continue with empty reports/ context for bootstrap."
          fi

          # Fail-safe: if telemetry.csv still doesn't exist, create a dummy header so Rust doesn't panic.
          if [ ! -f reports/telemetry.csv ]; then
            echo "timestamp,date,provider,market_state,risk_overlay,system_confidence,stability_score,dominance_margin,potential_energy,regime_age,up_count,flat_count,down_count,total_count,up_weight,flat_weight,down_weight,total_weight,config_hash,data_quality_status" > reports/telemetry.csv
            echo "⚠️ Created empty telemetry.csv with headers to prevent Rust panic."
          fi

          # 初回 legacy 回填では formal snapshot directory がまだ存在しないため、空集合として扱う。
          mkdir -p reports/snapshots
          RESTORED_SNAPSHOT_COUNT="$(find reports/snapshots -maxdepth 1 -type f -name '*.json' 2>/dev/null | wc -l | tr -d ' ')"
          RESTORED_LAST_SNAPSHOT_DATE="$(python - <<'PY'
          import json
          from pathlib import Path

          dates = []
          for path in Path("reports/snapshots").glob("*.json"):
              try:
                  value = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  continue
              report_date = value.get("report_date")
              if not isinstance(report_date, str):
                  # 旧 snapshot は market_date を報告日として扱う。
                  report_date = value.get("market_date")
              if isinstance(report_date, str):
                  dates.append(report_date)
          print(max(dates) if dates else "")
          PY
          )"
          RESTORED_HISTORY_COUNT="$(python - <<'PY'
          import json
          from pathlib import Path

          path = Path("reports/observation_history_state.json")
          try:
              value = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              value = {}
          count = value.get("count")
          print(count if type(count) is int and count >= 0 else 0)
          PY
          )"
          echo "RESTORED_SNAPSHOT_COUNT=${RESTORED_SNAPSHOT_COUNT}" >> $GITHUB_ENV
          echo "RESTORED_LAST_SNAPSHOT_DATE=${RESTORED_LAST_SNAPSHOT_DATE}" >> $GITHUB_ENV
          echo "RESTORED_HISTORY_COUNT=${RESTORED_HISTORY_COUNT}" >> $GITHUB_ENV
          RESTORED_LEGACY_PACKET_COUNT="$(python - <<'PY'
          import json
          from pathlib import Path

          dates = set()
          for path in Path("reports").glob("decision_packet_*.json"):
              try:
                  value = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  continue
              market_date = value.get("date")
              if isinstance(market_date, str):
                  dates.add(market_date)
          history = Path("reports/decision_history.jsonl")
          if history.exists():
              for line in history.read_text(encoding="utf-8").splitlines():
                  try:
                      value = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  market_date = value.get("date")
                  if isinstance(market_date, str):
                      dates.add(market_date)
          print(len(dates))
          PY
          )"
          echo "RESTORED_LEGACY_PACKET_COUNT=${RESTORED_LEGACY_PACKET_COUNT}" >> $GITHUB_ENV
          if [ "${RESTORED_SNAPSHOT_COUNT}" -eq 0 ] && [ -s reports/decision_history.jsonl ]; then
            echo "⚠️ Legacy decision history exists but formal trading-day snapshots were not restored; expected legacy dates=${RESTORED_LEGACY_PACKET_COUNT}."
          else
            echo "✅ Restored formal trading-day snapshots: count=${RESTORED_SNAPSHOT_COUNT}, last_date=${RESTORED_LAST_SNAPSHOT_DATE:-none}"
          fi

      - name: Resend Existing Daily Report
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'resend' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          DATE_JST="$(TZ=Asia/Tokyo date +%Y-%m-%d)"
          REPORT_PATH="reports/${DATE_JST}.md"
          STATUS_PATH="reports/run_status_${DATE_JST}.json"
          test -s "${REPORT_PATH}"
          test -s "${STATUS_PATH}"
          DATE_JST="${DATE_JST}" REPORT_PATH="${REPORT_PATH}" STATUS_PATH="${STATUS_PATH}" python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          date_jst = os.environ["DATE_JST"]
          report_path = Path(os.environ["REPORT_PATH"])
          status_path = Path(os.environ["STATUS_PATH"])
          bot_token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")
          if not bot_token or not chat_id:
              raise SystemExit("Telegram resend credentials are missing")

          status = json.loads(status_path.read_text(encoding="utf-8"))
          decisioning = status.get("decisioning")
          decisioning_succeeded = decisioning == "succeeded" or (
              isinstance(decisioning, dict) and "succeeded" in decisioning
          )
          if not decisioning_succeeded:
              raise SystemExit("archived report decisioning status is not succeeded")
          if status.get("date") not in (None, date_jst):
              raise SystemExit("archived report status date does not match JST date")

          report = report_path.read_text(encoding="utf-8").strip()
          if not report:
              raise SystemExit("archived report is empty")

          max_chunk_length = 3800
          chunks = [
              report[index : index + max_chunk_length]
              for index in range(0, len(report), max_chunk_length)
          ]
          url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
          for index, chunk in enumerate(chunks, start=1):
              prefix = (
                  f"📨 日报补发（{date_jst}，复用 data 分支已生成报告）\n\n"
                  if index == 1
                  else f"📨 日报补发（{date_jst}，第 {index}/{len(chunks)} 段）\n\n"
              )
              payload = json.dumps(
                  {
                      "chat_id": chat_id,
                      "text": prefix + chunk,
                      "disable_web_page_preview": True,
                  }
              ).encode("utf-8")
              request = Request(
                  url,
                  data=payload,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  with urlopen(request, timeout=30) as response:
                      response_body = json.loads(response.read().decode("utf-8"))
                      if response.status >= 300 or response_body.get("ok") is not True:
                          raise SystemExit(
                              f"Telegram resend returned an unsuccessful response for chunk {index}"
                          )
              except HTTPError as error:
                  raise SystemExit(
                      f"Telegram resend HTTP request failed for chunk {index}: status={error.code}"
                  ) from error
              except URLError as error:
                  raise SystemExit(
                      f"Telegram resend network request failed for chunk {index}: {error.reason}"
                  ) from error

          status["notification_resend"] = {
              "status": "succeeded",
              "source": "data_branch_archived_report",
              "report_date": date_jst,
              "chunks": len(chunks),
              "sent_at": datetime.now(timezone.utc).isoformat(),
          }
          status_path.write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"✅ Archived Telegram report resent successfully: chunks={len(chunks)}")
          PY
          echo "REPORT_DATE_JST=${DATE_JST}" >> "$GITHUB_ENV"
          echo "✅ Existing daily report was reused; radar recalculation was skipped."

      - name: Collect Evidence (non-blocking)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'resend' }}
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          EVIDENCE_DAYS: "7"
        run: |
          set -euo pipefail
          mkdir -p reports
          STATUS_PATH="reports/evidence_collection_status_latest.json"
          export STATUS_PATH

          write_status() {
            export EVIDENCE_STATUS="$1"
            export EVIDENCE_REASON="${2:-}"
            python - <<'PY'
          import json
          import os

          symbols = [s for s in os.environ.get("EVIDENCE_SYMBOLS", "").split(",") if s]
          payload = {
              "status": os.environ["EVIDENCE_STATUS"],
              "reason": os.environ.get("EVIDENCE_REASON") or None,
              "symbols": symbols,
              "days": int(os.environ.get("EVIDENCE_DAYS", "7")),
          }
          with open(os.environ["STATUS_PATH"], "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)
              f.write("\n")
          PY
          }

          trap 'code=$?; write_status "failed" "unexpected evidence collection step error (exit ${code})"; echo "⚠️ Evidence collection failed before completion but radar will continue."; exit 0' ERR

          EVIDENCE_SYMBOLS="$(python - <<'PY'
          import tomllib

          with open("config.toml", "rb") as f:
              config = tomllib.load(f)

          symbols = [
              item["symbol"]
              for item in config.get("watchlist", [])
              if item.get("enable", True) and item.get("symbol")
          ]
          print(",".join(symbols))
          PY
          )"
          export EVIDENCE_SYMBOLS

          if [ -z "${EVIDENCE_SYMBOLS}" ]; then
            write_status "skipped" "watchlist symbols are empty"
            echo "ℹ️ Evidence collection skipped: watchlist symbols are empty."
            exit 0
          fi

          if [ -z "${FINNHUB_API_KEY:-}" ]; then
            write_status "skipped" "FINNHUB_API_KEY is not configured"
            echo "ℹ️ Evidence collection skipped: FINNHUB_API_KEY is not configured."
            exit 0
          fi

          OUTPUT_FILE="$(mktemp)"
          set +e
          make collect-evidence-release COLLECT_EVIDENCE_ARGS="--symbols ${EVIDENCE_SYMBOLS} --days ${EVIDENCE_DAYS}" >"${OUTPUT_FILE}" 2>&1
          EXIT_CODE=$?
          set -e
          cat "${OUTPUT_FILE}"

          if [ "${EXIT_CODE}" -eq 0 ]; then
            write_status "succeeded" ""
            echo "✅ Evidence collection completed."
          else
            REASON="$(tail -n 20 "${OUTPUT_FILE}" | tr '\n' ' ' | cut -c1-1000)"
            write_status "failed" "${REASON}"
            echo "⚠️ Evidence collection failed but radar will continue."
          fi

      - name: Run Sentinel Radar
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'resend' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          set -euo pipefail
          echo "RUN_AT_JST=$(date +'%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_ENV
          DATE_JST="$(TZ=Asia/Tokyo date +%Y-%m-%d)"
          STATUS_PATH="reports/gray_rhino_refresh_status_latest.json"
          mkdir -p reports

          write_gray_rhino_status() {
            local status="$1"
            local reason="${2:-}"
            STATUS_VALUE="${status}" REASON_VALUE="${reason}" DATE_VALUE="${DATE_JST}" python - <<'PY'
          import json
          import os

          payload = {
              "status": os.environ["STATUS_VALUE"],
              "reason": os.environ.get("REASON_VALUE") or None,
              "date": os.environ["DATE_VALUE"],
          }
          with open("reports/gray_rhino_refresh_status_latest.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)
              f.write("\n")
          with open(f"reports/gray_rhino_refresh_status_{os.environ['DATE_VALUE']}.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)
              f.write("\n")
          with open("reports/gray_rhino_refresh_status.jsonl", "a", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)
              f.write("\n")
          PY
          }

          GRAY_RHINO_PROVIDERS=""
          if [ -n "${SEC_USER_AGENT:-}" ]; then
            GRAY_RHINO_PROVIDERS="${GRAY_RHINO_PROVIDERS} sec"
          fi
          if [ -n "${FINNHUB_API_KEY:-}" ]; then
            GRAY_RHINO_PROVIDERS="${GRAY_RHINO_PROVIDERS} finnhub"
          fi
          if [ -n "${FRED_API_KEY:-}" ]; then
            GRAY_RHINO_PROVIDERS="${GRAY_RHINO_PROVIDERS} fred"
          fi
          GRAY_RHINO_PROVIDERS="$(echo "${GRAY_RHINO_PROVIDERS}" | xargs)"

          if [ -z "${GRAY_RHINO_PROVIDERS}" ]; then
            write_gray_rhino_status "skipped" "No Gray Rhino provider credentials are configured"
            echo "ℹ️ Gray Rhino refresh skipped before radar: no provider credentials are configured."
          else
            OUTPUT_FILE="$(mktemp)"
            set +e
            make gray-rhino-refresh \
              GRAY_RHINO_REFRESH_PROVIDERS="${GRAY_RHINO_PROVIDERS}" \
              GRAY_RHINO_REFRESH_DATE="${DATE_JST}" \
              GRAY_RHINO_REFRESH_ARGS="--date ${DATE_JST}" >"${OUTPUT_FILE}" 2>&1
            REFRESH_EXIT_CODE=$?
            set -e
            cat "${OUTPUT_FILE}"
            if [ "${REFRESH_EXIT_CODE}" -eq 0 ]; then
              echo "✅ Gray Rhino refresh completed before radar."
            else
              REASON="$(tail -n 20 "${OUTPUT_FILE}" | tr '\n' ' ' | cut -c1-1000)"
              if [ ! -f "${STATUS_PATH}" ]; then
                write_gray_rhino_status "failed" "${REASON}"
              fi
              echo "⚠️ Gray Rhino refresh failed before radar but radar will continue."
            fi
          fi

          make radar-release

          REPORT_DATE_JST="${DATE_JST}"
          REPORT_PACKET_PATH="reports/decision_packet_${DATE_JST}.json"
          RUN_STATUS_PATH="reports/run_status_${DATE_JST}.json"
          if [ ! -s "${REPORT_PACKET_PATH}" ]; then
            if [ -s "${RUN_STATUS_PATH}" ]; then
              DECISIONING_FAILED_REASON="$(RUN_STATUS_PATH="${RUN_STATUS_PATH}" python - <<'PY'
          import json
          import os

          with open(os.environ["RUN_STATUS_PATH"], encoding="utf-8") as handle:
              decisioning = json.load(handle).get("decisioning")
          if isinstance(decisioning, dict) and isinstance(decisioning.get("failed"), dict):
              print(decisioning["failed"].get("reason", "unknown"))
          elif isinstance(decisioning, str):
              print(decisioning)
          else:
              print("unknown")
          PY
              )"
              echo "❌ Current JST report packet is missing: ${REPORT_PACKET_PATH} (decisioning_failed_reason=${DECISIONING_FAILED_REASON})"
            else
              echo "❌ Current JST report packet is missing: ${REPORT_PACKET_PATH}"
            fi
            exit 1
          fi

          if [ ! -s "${RUN_STATUS_PATH}" ]; then
            echo "❌ Current JST run status is missing: ${RUN_STATUS_PATH}"
            exit 1
          fi

          DECISIONING_STATUS="$(RUN_STATUS_PATH="${RUN_STATUS_PATH}" python - <<'PY'
          import json
          import os

          with open(os.environ["RUN_STATUS_PATH"], encoding="utf-8") as handle:
              decisioning = json.load(handle).get("decisioning")
          if decisioning == "succeeded" or (
              isinstance(decisioning, dict) and "succeeded" in decisioning
          ):
              print("succeeded")
          else:
              print("failed")
          PY
          )"
          if [ "${DECISIONING_STATUS}" != "succeeded" ]; then
            echo "❌ Current JST decisioning status is not succeeded: ${RUN_STATUS_PATH}"
            exit 1
          fi

          echo "REPORT_DATE_JST=${REPORT_DATE_JST}" >> "$GITHUB_ENV"
          echo "✅ Current JST report artifacts and decisioning status verified: ${REPORT_DATE_JST}"

      - name: Show Notification Outcome
        run: |
          set -euo pipefail

          DATE_JST="${REPORT_DATE_JST:-$(TZ=Asia/Tokyo date +%Y-%m-%d)}"
          RUN_STATUS_PATH="reports/run_status_${DATE_JST}.json"

          if [ ! -f "${RUN_STATUS_PATH}" ]; then
            echo "⚠️ run_status not found yet: ${RUN_STATUS_PATH}"
            exit 0
          fi

          STATUS_PATH="${RUN_STATUS_PATH}" python - <<'PY'
          import json
          import os
          path = os.environ["STATUS_PATH"]
          data = json.load(open(path, encoding="utf-8"))
          resend = data.get("notification_resend")
          notification = data.get("notification", "missing")
          print("=== NOTIFICATION OUTCOME ===")
          if isinstance(resend, dict):
              print(f"resend_status={resend.get('status', 'missing')}")
              print(f"resend_source={resend.get('source', 'missing')}")
              print(f"resend_chunks={resend.get('chunks', 'missing')}")
          if isinstance(notification, str):
              print(f"status={notification}")
          elif isinstance(notification, dict):
              if "failed" in notification:
                  print("status=failed")
                  print(f"reason={notification['failed'].get('reason', '')}")
              elif "skipped" in notification:
                  print("status=skipped")
              elif "succeeded" in notification:
                  print("status=succeeded")
              else:
                  print(f"status={notification}")
          else:
              print(f"status={notification}")
          print("============================")
          PY

      - name: Freshness Gate and Output Validation
        run: |
          set -euo pipefail
          
          DATE_JST="${REPORT_DATE_JST:-$(TZ=Asia/Tokyo date +%Y-%m-%d)}"
          
          # 1. Output Integrity Checks (Prevent pushing empty/failed reports)
          REQUIRED_FILES=(
            "reports/${DATE_JST}.md"
            "reports/decision_packet_${DATE_JST}.json"
            "reports/decision_history.jsonl"
            "reports/state_transitions.csv"
            "reports/state_transitions.jsonl"
            "reports/execution_gate_log.jsonl"
            "reports/portfolio_snapshot_${DATE_JST}.json"
            "reports/account_snapshot_${DATE_JST}.json"
            "reports/data_quality_log.jsonl"
            "reports/run_status_${DATE_JST}.json"
            "reports/evidence_collection_status_latest.json"
            "reports/gray_rhino_refresh_status_latest.json"
            "reports/weekly_state_metrics.json"
            "reports/weekly_state_review_auto.md"
            "reports/telemetry.csv"
          )
          
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -s "$file" ]; then
              echo "❌ CRITICAL: Required archival asset $file is missing or empty!"
              exit 1
            fi
          done

          HISTORY_STATE="reports/observation_history_state.json"
          CURRENT_SNAPSHOT="$(DATE_JST="${DATE_JST}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected_date = os.environ["DATE_JST"]
          for path in sorted(Path("reports/snapshots").glob("*.json")):
              try:
                  value = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  continue
              snapshot_report_date = value.get("report_date")
              if not isinstance(snapshot_report_date, str):
                  # 旧 snapshot は market_date を報告日として扱う。
                  snapshot_report_date = value.get("market_date")
              if snapshot_report_date == expected_date:
                  print(path)
                  break
          PY
          )"
          if [ ! -s "${HISTORY_STATE}" ]; then
            echo "❌ CRITICAL: observation history state is missing or empty: ${HISTORY_STATE}"
            exit 1
          fi
          if [ -z "${CURRENT_SNAPSHOT}" ] || [ ! -s "${CURRENT_SNAPSHOT}" ]; then
            echo "❌ CRITICAL: current trading-day snapshot is missing or empty for ${DATE_JST}"
            exit 1
          fi
          if [ "${RESTORED_SNAPSHOT_COUNT:-0}" -gt 0 ] \
            && [ -n "${RESTORED_LAST_SNAPSHOT_DATE:-}" ] \
            && [ "${DATE_JST}" != "${RESTORED_LAST_SNAPSHOT_DATE}" ]; then
            CURRENT_SNAPSHOT_COUNT="$(find reports/snapshots -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')"
            if [ "${CURRENT_SNAPSHOT_COUNT}" -le "${RESTORED_SNAPSHOT_COUNT}" ]; then
            echo "❌ CRITICAL: formal snapshot history did not append across the new report date"
              exit 1
            fi
          fi
          if [ "${RESTORED_SNAPSHOT_COUNT:-0}" -eq 0 ] \
            && [ "${RESTORED_LEGACY_PACKET_COUNT:-0}" -gt 0 ]; then
            CURRENT_SNAPSHOT_COUNT="$(find reports/snapshots -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')"
            if [ "${CURRENT_SNAPSHOT_COUNT}" -le "${RESTORED_LEGACY_PACKET_COUNT}" ]; then
              echo "❌ CRITICAL: legacy history was not fully backfilled into formal snapshots"
              exit 1
            fi
          fi
          python - "${HISTORY_STATE}" "${CURRENT_SNAPSHOT}" "${DATE_JST}" "${RESTORED_HISTORY_COUNT:-0}" "${RESTORED_SNAPSHOT_COUNT:-0}" "${RESTORED_LAST_SNAPSHOT_DATE:-}" <<'PY'
          import json
          import sys

          state = json.load(open(sys.argv[1], encoding="utf-8"))
          snapshot = json.load(open(sys.argv[2], encoding="utf-8"))
          expected_date = sys.argv[3]
          restored_history_count = int(sys.argv[4])
          restored_snapshot_count = int(sys.argv[5])
          restored_last_snapshot_date = sys.argv[6]
          if not state.get("cycle_id"):
              raise SystemExit("observation history state has no cycle_id")
          history_count = state.get("count")
          if type(history_count) is not int or history_count < 1:
              raise SystemExit("observation history state has no valid count")
          if state["cycle_id"] != snapshot.get("cycle_id"):
              raise SystemExit("current snapshot cycle_id does not match observation history state")
          snapshot_report_date = snapshot.get("report_date")
          if isinstance(snapshot_report_date, str) and snapshot_report_date:
              if snapshot_report_date != expected_date:
                  raise SystemExit("current snapshot report_date does not match report date")
          elif snapshot.get("market_date") != expected_date:
              raise SystemExit("legacy current snapshot market_date does not match report date")
          if not isinstance(snapshot.get("market_date"), str):
              raise SystemExit("current snapshot has no market_date")
          if (
              restored_snapshot_count > 0
              and restored_last_snapshot_date
              and expected_date != restored_last_snapshot_date
              and history_count <= restored_history_count
          ):
              raise SystemExit("observation history state count did not append across the new report date")
          print(f"✅ Formal snapshot/state continuity verified: cycle_id={state['cycle_id']}")
          PY

          # Evidence records are append-only but can legitimately be empty
          # on days with no extracted substantive evidence.
          touch "reports/evidence_records.jsonl"
          
          echo "✅ Required archival assets verified."

          
          # 2. Freshness Gate Logic
          if [ -f "reports/freshness.json" ]; then
            echo "freshness.json found, validating..."
            python - <<'PY'
          import json, sys, pathlib
          p="reports/freshness.json"
          try:
              d=json.load(open(p))
              stale=d.get("stale", False)
              max_age=d.get("max_age_minutes", None)
              if stale:
                  print(f"⚠️ STALE: max_age_minutes={max_age} (continuing, but marking run)")
                  pathlib.Path("reports/STALE_RUN").write_text(f"stale max_age_minutes={max_age}\n")
              else:
                  print(f"✅ Freshness OK (max_age={max_age}m).")
          except Exception as e:
              print(f"⚠️ Error checking freshness: {e}")
          PY
          else
            echo "⚠️ No freshness.json; skipping gate."
          fi

      - name: Commit and Push to Data Worktree
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          ROOT_DIR="${GITHUB_WORKSPACE}"
          DATA_DIR="${ROOT_DIR}/.worktrees/data"
          DATE_JST="${REPORT_DATE_JST:-$(TZ=Asia/Tokyo date +%Y-%m-%d)}"

          # Clean any stale worktree state (paranoia mode: destroy abandoned locks)
          git worktree remove --force "${DATA_DIR}" 2>/dev/null || true
          git worktree prune || true
          rm -rf "${DATA_DIR}" || true
          mkdir -p "$(dirname "${DATA_DIR}")"

          # 1. ensure data branch exists; if not, create & push once
          set +e
          git ls-remote --exit-code --heads origin data >/dev/null 2>&1
          REMOTE_DATA_BRANCH_LOOKUP_STATUS=$?
          set -e
          case "${REMOTE_DATA_BRANCH_LOOKUP_STATUS}" in
            0)
              REMOTE_DATA_BRANCH_EXISTS=true
              ;;
            2)
              REMOTE_DATA_BRANCH_EXISTS=false
              ;;
            *)
              echo "❌ Could not determine whether the remote data branch exists; refusing to bootstrap or overwrite data."
              exit 1
              ;;
          esac
          if [ "${REMOTE_DATA_BRANCH_EXISTS}" = "false" ]; then
            echo "Remote data branch not found. Bootstrapping..."

            git worktree add --detach "${DATA_DIR}"
            cd "${DATA_DIR}"
            git checkout --orphan data
            git rm -rf . >/dev/null 2>&1 || true
            git branch -M data

            echo "# Sentinel data branch" > README.md
            mkdir -p reports
            git add -A
            git commit -m "init data branch"

            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" 2>/dev/null || true
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin data

            cd "${ROOT_DIR}"
            git worktree remove --force "${DATA_DIR}" 2>/dev/null || true
            rm -rf "${DATA_DIR}" || true
          fi

          # 2. Add worktree from remote data
          git fetch origin refs/heads/data:refs/remotes/origin/data
          git worktree add "${DATA_DIR}" -B data origin/data

          # 3. Hop into worktree and pull latest state BEFORE modifying files
          cd "${DATA_DIR}"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout data
          
          git fetch origin refs/heads/data:refs/remotes/origin/data
          git pull --rebase origin data

          # 4. Port over generated reports cleanly (Mirror Strategy for snapshots)
          cd "${ROOT_DIR}"
          mkdir -p "${DATA_DIR}/reports"
          
          echo "PWD=$(pwd)"
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
          echo "DATA_DIR=${DATA_DIR}"
          ls -la "${ROOT_DIR}/reports" || true

          make -C "${ROOT_DIR}" prune-data-history PRUNE_DATA_HISTORY_ARGS="--reports-dir ${ROOT_DIR}/reports"
          rsync -a --delete "${ROOT_DIR}/reports/" "${DATA_DIR}/reports/"
          
          # 5. Commit and push
          cd "${DATA_DIR}"
          git add -f reports/
          
          if ! git diff --cached --quiet; then
            echo "Pushing update to: $(git remote get-url origin | sed -e 's/x-access-token:.*@/x-access-token:***@/')"
            git commit -m "Stock Sentinel Observation: ${RUN_AT_JST:-$(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M:%S %Z')}"
            # Protect history with lease, fallback to rebase retry if concurrent write detected
            git push origin data --force-with-lease || (git pull --rebase origin data && git push origin data --force-with-lease)
          else
            echo "No changes to commit in data branch."
          fi

          # Verify the persisted branch, not only the local worktree and push exit code.
          git fetch origin refs/heads/data:refs/remotes/origin/data
          LOCAL_HISTORY_STATE="$(mktemp)"
          REMOTE_HISTORY_STATE="$(mktemp)"
          trap 'rm -f "${LOCAL_HISTORY_STATE}" "${REMOTE_HISTORY_STATE}"' EXIT
          cp "${ROOT_DIR}/reports/observation_history_state.json" "${LOCAL_HISTORY_STATE}"
          git show origin/data:reports/observation_history_state.json > "${REMOTE_HISTORY_STATE}"
          python - "${LOCAL_HISTORY_STATE}" "${REMOTE_HISTORY_STATE}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              local = json.load(handle)
          with open(sys.argv[2], encoding="utf-8") as handle:
              remote = json.load(handle)
          if type(local.get("count")) is not int or local["count"] < 1:
              raise SystemExit("local observation history state has no valid count")
          if type(remote.get("count")) is not int or remote["count"] < local["count"]:
              raise SystemExit("remote observation history count is behind the local persisted state")
          if not local.get("cycle_id") or remote.get("cycle_id") != local["cycle_id"]:
              raise SystemExit("remote observation history cycle_id does not match the local persisted state")
          print(f"✅ Remote data branch persistence verified: count={remote['count']}, cycle_id={remote['cycle_id']}")
          PY

      - name: Notify on Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          # Use ANSI-C quoting for real newlines in Telegram
          MSG=$'❌ Daily Radar FAILED on '"${GITHUB_REPOSITORY}"$'\n'
          MSG+=$'Workflow: '"${GITHUB_WORKFLOW}"$'\n'
          MSG+=$'Run: '"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"$'\n'
          MSG+=$'Commit: '"${GITHUB_SHA::7}"
          
          if ! TELEGRAM_RESPONSE="$(curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${MSG}")"; then
            echo "Failed to send Telegram notification: HTTP request failed" >&2
            exit 1
          fi
          if ! jq -e '.ok == true' >/dev/null <<<"${TELEGRAM_RESPONSE}"; then
            echo "Failed to send Telegram notification: Telegram API returned ok=false" >&2
            exit 1
          fi
