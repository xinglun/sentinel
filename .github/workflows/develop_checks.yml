name: Code Branch Quality Gates

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  validate:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Protoc (Required for Futu)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: make fmt-check

      - name: Check Audit Doc Consistency
        run: make audit-docs
        
      - name: Check Warnings (Clippy)
        run: make clippy

      - name: Run Unit Tests
        run: make test

      - name: Run AI Governance Checks
        env:
          AI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: make check-ai

  audit-daily-guard:
    name: Audit Daily Guard
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Detect audit_daily related changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            audit_daily:
              - 'src/cli.rs'
              - 'src/core/transition_log.rs'
              - 'src/config.rs'
              - 'README.md'
              - 'docs/specs/WEEKLY_STATE_REVIEW_RUNBOOK.md'
              - 'tests/audit_daily_cli_integration.rs'
              - 'tests/snapshots/audit_daily_*.txt'
              - 'scripts/check_audit_docs.sh'

      - name: Setup Rust Toolchain
        if: steps.changes.outputs.audit_daily == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Protoc (Required for Futu)
        if: steps.changes.outputs.audit_daily == 'true'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache Dependencies
        if: steps.changes.outputs.audit_daily == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Run audit_daily specialized tests
        if: steps.changes.outputs.audit_daily == 'true'
        run: |
          make test-audit-daily

      - name: Check audit docs consistency
        if: steps.changes.outputs.audit_daily == 'true'
        run: make audit-docs

      - name: Skip guard when unrelated
        if: steps.changes.outputs.audit_daily != 'true'
        run: echo "No audit_daily related file changes detected; guard skipped."
