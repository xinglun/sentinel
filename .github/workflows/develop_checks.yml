name: Code Branch Quality Gates

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  validate:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Protoc (Required for Futu)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Coverage Tool
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Check Rust Format
        run: make fmt-check

      - name: Check Documentation
        run: make check-docs-metadata

      - name: Check Architecture
        run: make check-architecture-all

      - name: Run Rust Tests
        timeout-minutes: 20
        run: make test

      - name: Run Clippy
        run: make clippy

      - name: Install AI Cockpit Runtime
        env:
          AI_COCKPIT_VERSION: "0.2.33"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runtime_dir="${RUNNER_TEMP}/ai-cockpit"
          archive="ai-cockpit-v${AI_COCKPIT_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "${runtime_dir}/bin" "${runtime_dir}/extracted"
          gh release download "v${AI_COCKPIT_VERSION}" \
            --repo xinglun/ai-cockpit \
            --pattern "${archive}" \
            --pattern SHA256SUMS \
            --dir "${runtime_dir}"
          expected="$(awk -v name="${archive}" '$2 == name { print $1 }' "${runtime_dir}/SHA256SUMS")"
          actual="$(sha256sum "${runtime_dir}/${archive}" | awk '{ print $1 }')"
          test -n "${expected}"
          test "${expected}" = "${actual}"
          tar -xzf "${runtime_dir}/${archive}" -C "${runtime_dir}/extracted"
          runtime_binary="$(find "${runtime_dir}/extracted" -type f -name ai-cockpit -perm -u+x -print -quit)"
          test -n "${runtime_binary}"
          install -m 0755 "${runtime_binary}" "${runtime_dir}/bin/ai-cockpit"
          echo "${runtime_dir}/bin" >> "${GITHUB_PATH}"
          "${runtime_dir}/bin/ai-cockpit" --version

      - name: Check AI Cockpit Runtime
        run: |
          set -euo pipefail
          ai-cockpit doctor --repo "${GITHUB_WORKSPACE}"
          ai-cockpit compatibility --repo "${GITHUB_WORKSPACE}"

      - name: Run AI Cockpit Verification
        env:
          AI_BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
          AI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ "${AI_BASE_COMMIT}" = "0000000000000000000000000000000000000000" ]; then
            echo "Skipping pull request verification because the event has no base commit."
            exit 0
          fi
          ai-cockpit verify \
            --repo "${GITHUB_WORKSPACE}" \
            --stage pr \
            --base-revision "${AI_BASE_COMMIT}" \
            --command make \
            --args quality \
            --workers 2

  audit-daily-guard:
    name: Audit Daily Guard
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Detect audit_daily related changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            audit_daily:
              - 'src/cli.rs'
              - 'src/core/transition_log.rs'
              - 'src/config.rs'
              - 'README.md'
              - 'docs/specs/WEEKLY_STATE_REVIEW_RUNBOOK.md'
              - 'tests/audit_daily_cli_integration.rs'
              - 'tests/snapshots/audit_daily_*.txt'
              - 'scripts/check_audit_docs.sh'

      - name: Setup Rust Toolchain
        if: steps.changes.outputs.audit_daily == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Protoc (Required for Futu)
        if: steps.changes.outputs.audit_daily == 'true'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache Dependencies
        if: steps.changes.outputs.audit_daily == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Run audit_daily specialized tests
        if: steps.changes.outputs.audit_daily == 'true'
        run: |
          make test-audit-daily

      - name: Check audit docs consistency
        if: steps.changes.outputs.audit_daily == 'true'
        run: make audit-docs

      - name: Skip guard when unrelated
        if: steps.changes.outputs.audit_daily != 'true'
        run: echo "No audit_daily related file changes detected; guard skipped."
