version: 1
recordDirectory: .ai/evidence/reference-impact
outputDirectory: target/reference-impact
operations:
  - delete
  - rename
  - move
  - deprecate
  - change_visibility
  - change_signature
  - remove_configuration
  - remove_public_api
targetTypes:
  - function
  - class
  - method
  - api
  - configuration_key
  - feature_flag
  - database_field
  - cli_option
  - environment_variable
  - workflow_job
  - make_target
  - script_entrypoint
  - file
  - directory
  - package
  - module
  - build_module
  - serialization_format
analysis:
  supported:
    - generic_text
    - python_ast
    - typescript_basic
  unsupportedLanguageLabel: generic_analysis_only
  limitations:
    - reflection
    - aliases
    - generated_code
    - runtime_loading
    - external_repositories
    - monitoring_consumers
  falsePositiveRisk: Text analyzers can report non-executable examples or strings as references.
  falseNegativeRisk: Generic and TypeScript basic analysis can miss semantic, generated, aliased, or runtime references.
evidence:
  nonLocalCategories:
    - dynamicReferences
    - externalConsumers
    - monitoringReferences
  allowedAbsentStatus: proven_absent
  requireNonEmptyEvidence: true
  rejectStale: true
  governanceRequirements:
    - contractDeclared
    - acceptanceDeclared
    - destructiveChangeAllowed
decisions:
  block:
    - live_static_reference
    - live_configuration_reference
    - live_documentation_reference
    - declared_or_observed_factual_conflict
  needs_human_confirmation:
    - bypass_request
    - weak_or_unbound_approval
    - missing_impact_record
    - unknown_dynamic_reference
    - unknown_external_consumer
    - unknown_monitoring_reference
    - remove_public_api
    - remove_configuration
recovery:
  block: Remove or migrate live references and correct the factual conflict.
  needsHumanConfirmation: Supply current migration, owner, monitoring, and governance evidence, then rerun.
