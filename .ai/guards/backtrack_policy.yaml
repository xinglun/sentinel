# AI coding 中の無宣言な後退を阻止する hard gate policy。

version: 1

reportOnly: false

watch:
  deletedTests:
    patterns:
      - "src/**/*test*.rs"
      - "tests/**/*.rs"
    severity: error
    reason: テスト削除は機能回帰を隠す可能性がある。

  deletedSnapshots:
    patterns:
      - "tests/snapshots/**"
      - "src/**/snapshots/**"
    severity: error
    reason: snapshot 削除は表示契約の後退につながる。

  i18nKeyRemoval:
    patterns:
      - "src/features/shared/interface/i18n.rs"
    severity: error
    reason: 多言語 key の削除は Telegram / Markdown 出力の回帰につながる。

  workItemEvidenceRemoval:
    patterns:
      - ".ai/work-items/**"
    severity: error
    reason: Contract / Summary の証跡削除は review 可能性を下げる。

output:
  json: target/ai_backtrack_report.json
