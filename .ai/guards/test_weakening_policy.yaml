version: 1

# These thresholds produce review signals, not proof that smaller changes are safe.
thresholds:
  materialAssertionMinimumBefore: 4
  materialAssertionRatio: 0.6
  snapshotReviewChangedLines: 20

decisions:
  warning:
    - test_renamed
    - test_case_renamed_or_refactored
    - snapshot_changed
    - minor_assertion_reduction
    - assertion_condition_relaxed
  review:
    - test_file_deleted
    - test_case_removed
    - assertion_reduction
    - skip_added
    - exception_assertion_removed
    - negative_test_removed
    - snapshot_churn
    - coverage_exclusion_added
    - coverage_source_reduced
    - coverage_threshold_lowered
    - test_command_scope_reduced
    - required_check_made_nonblocking
  block:
    - explicit_test_bypass_request
    - security_test_deleted
    - regression_test_deleted
    - ci_continue_on_error_added
    - test_command_success_bypass_added
    - coverage_threshold_lowered_to_pass

recoveryCondition: Restore test strength or provide independently reviewable changed-requirement evidence.
