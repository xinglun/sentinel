version: 1

statusFile: .ai/cockpit/current_status.md
generator:
  command: make generate-cockpit-status
  script: scripts/ai_generate_status.py
  manualEdit: prohibited

states:
  active:
    allowedStates:
      - blocked
      - ready_for_review
      - ready_with_risks
    contractPathPattern: .ai/work-items/active/<task>.contract.json
    summaryPathPattern: .ai/work-items/active/<task>.summary.json
  noActive:
    state: no_active_work_item
    command: make generate-cockpit-status ARGS=--no-active
    allowedWhen:
      - active Work Item が存在しない
      - archive 後に現在作業として表示する Contract が存在しない
    requiredFields:
      Task: none
      Mode: none
      State: no_active_work_item
      Contract Path: ""
      Summary Path: ""

consistency:
  command: make check-ai-status-consistency
  rules:
    - current_status.md が Contract Path を持つ場合、そのファイルは存在する。
    - current_status.md が Summary Path を持つ場合、そのファイルは存在する。
    - Summary Path が存在する場合、summary.contractPath は current_status.md の Contract Path と一致する。
    - no_active_work_item の場合、active Work Item JSON は残さない。
    - no_active_work_item の場合、Contract Path と Summary Path は空にする。

archivePolicy:
  command: make ai-finish TASK=<task>
  requiredAfterArchive:
    - make check-work-items-lifecycle
    - make check-ai-status-consistency
  currentStatus:
    noActiveCommand: make generate-cockpit-status ARGS=--no-active
    requiredWhenActiveEmpty: true
