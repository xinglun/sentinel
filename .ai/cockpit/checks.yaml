# Sentinel の AI Work Item で利用する共通 check catalog。

version: 1

checks:
  rustFmt:
    command: make fmt-check
    purpose: Rust formatting contract を確認する。

  rustTest:
    command: make test
    purpose: unit / integration / doc test を通す。

  rustClippy:
    command: make clippy
    purpose: warning を許容しない静的検査を通す。

  auditDocs:
    command: make audit-docs
    purpose: audit_daily ドキュメント契約を確認する。

  diffCheck:
    command: make diff-check
    purpose: whitespace と patch 形式の問題を検出する。

  aiWorkItem:
    commandTemplate: make check-ai-contract CONTRACT={contractPath}
    purpose: Work Item Contract の必須項目と coding 可否を確認する。


  aiScope:
    commandTemplate: make check-ai-scope CONTRACT={contractPath}
    purpose: 実 diff が Work Item Contract の scope / outOfScope に合っていることを確認する。

  aiGuards:
    command: make check-ai-guards
    purpose: file ownership / boundary guard を検証する。管理対象 diff は Contract scope を必須とし、forbidden は常に失敗する。

  aiSummary:
    commandTemplate: make check-ai-change-summary SUMMARY={summaryPath} CONTRACT={contractPath}
    purpose: AI Change Summary と Contract の対応を確認する。

  aiCheckpoint:
    commandTemplate: make ai-checkpoint CONTRACT={contractPath} SUMMARY={summaryPath} STAGE={stage}
    purpose: checkpoint evidence chain と required check の状態を手動で確認する。

  aiBacktrack:
    command: make check-ai-backtrack
    purpose: test / snapshot / i18n / Work Item evidence の無宣言な後退を hard fail する。破壊的変更は Contract と Summary の両方へ記録する。

  aiCoverage:
    command: make check-ai-coverage-guard
    purpose: production Rust code の変更に test 変更証跡がない場合は hard fail する。

  aiStatus:
    commandTemplate: make generate-cockpit-status CONTRACT={contractPath} SUMMARY={summaryPath}
    purpose: Cockpit current status を生成する。


  aiStatusCheck:
    commandTemplate: make check-ai-status CONTRACT={contractPath} SUMMARY={summaryPath}
    purpose: current_status.md が Contract / Summary と一致し、required checks が passed と表示されることを確認する。

  aiStatusConsistency:
    command: make check-ai-status-consistency
    purpose: current_status.md が存在する Contract / Summary、または no_active_work_item 状態と一致することを確認する。

  aiPr:
    command: make check-ai-pr
    purpose: PR diff に含まれる archive Work Item の Contract / Summary 整合性と append-only 性を確認する。

selectionRules:
  - "Contract の verification を最優先する。"
  - "すべての Work Item Contract は `make fmt-check` を required verification として含める。"
  - "`src/features/radar/interface/report.rs`、`src/features/radar/interface/presentation_assembler.rs`、`src/features/radar/interface/radar_pipeline_runner.rs`、`src/features/shared/interface/i18n.rs` を変更した場合は report UI / i18n 系 test を含める。"
  - "`src/features/research/**` を変更した場合は research / Gray Rhino 系 test を含める。"
  - "`src/cli.rs`、`src/features/radar/application/transition_log.rs`、audit_daily snapshot を変更した場合は audit_daily 専用 test を含める。"
  - "test、snapshot、i18n、`.ai/work-items/**` を変更した場合は Backtrack Guard を実行し、無宣言削除を許可しない。"
  - "`src/**/*.rs` を変更した場合は Coverage Guard を実行し、test 変更証跡を必須とする。"
  - "Work Item を archive した場合、または `.ai/cockpit/current_status.md` を更新した場合は `make check-ai-status-consistency` を実行する。"
  - "pull_request や release 前の diff で `.ai/work-items/archive/**` を含む場合は `make check-ai-pr AI_BASE_COMMIT=<merge-base-sha>` を実行する。"
