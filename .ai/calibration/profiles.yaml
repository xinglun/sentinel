version: 1
levels:
  - lite
  - standard
  - strict
controls:
  lite:
    - source_paths
    - test_paths
    - generated_paths
    - protected_paths
    - quality_command
    - default_branch
    - project_owner
    - reviewer
    - major_unknowns
  standard:
    - file_ownership
    - scenario_coverage
    - destructive_change_policy
    - dependency_policy
    - ci_policy
    - public_api_policy
    - lifecycle_policy
    - delegated_evidence
  strict:
    - reviewer_owner_separation
    - external_identity_evidence
    - release_evidence
    - sbom
    - provenance
    - signed_tag_policy
    - branch_protection_evidence
    - audit_retention
    - incident_exception_policy
